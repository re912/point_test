{% extends 'base.html' %}

{% block title %}ポイント履歴{% endblock %}

{% block content %}
<h2>ポイント履歴</h2>
<table class="history-table">
    <thead>
        <tr>
            <th>顧客名</th>
            <th>ポイント変更</th>
            <th>操作</th>
            <th>日時</th>
            <th>削除</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in history %}
        <tr>
            <td>{{ entry[1] }}</td>
            <td>{{ entry[2] }}</td>
            <td>{{ entry[3] }}</td>
            <td>{{ entry[4] }}</td>
            <td>
                <form method="POST" action="{{ url_for('delete_history', history_id=entry[0]) }}">
                    <button type="submit" class="delete-button">削除</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
